# Phase 1: kein Keycloak. OIDC kann später über die lua_*.lua-Dateien ergänzt werden.
server {
  listen 8080;
  client_max_body_size 0;
  resolver 127.0.0.11 valid=30s;

  location = /attributes.json { alias /data-files/attributes.json; }
  location = /localCT.json    { alias /data-files/localCT.json; }
  location = /tumorTypes.json { alias /data-files/tumorTypes.json; }

  # /reports/<studie>/<patient>/<datei>: Zugriff nur, wenn cBioPortal dem Nutzer
  # (Session-Cookie) die Studie anzeigt. Ordnername = Studien-ID in Kleinbuchstaben.
  # Ohne Authentifizierung (--authenticate=false) ist /api/studies/<id> offen, der Schutz greift dann nicht.
  location ~ ^/reports/(?<report_study>[A-Za-z0-9_-]+)/ {
    set_by_lua_block $rstudy { return string.lower(ngx.var.report_study) }
    auth_request /_report_auth;
    error_page 401 403 404 500 502 =403 @report_denied;
    root /usr/share;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
  }

  location ~ ^/reports/ { return 403; }

  location = /_report_auth {
    internal;
    proxy_pass http://cbioportal:8080/api/studies/$rstudy;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Accept application/json;
    proxy_set_header Cookie $http_cookie;
  }

  location @report_denied { return 403 "forbidden\n"; }

  location = /quickqueck/search/json/ {
    set $qq https://www.quickqueck.de;
    proxy_pass $qq/search/json/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.quickqueck.de;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location / {
    set $upstream http://cbioportal:8080;
    proxy_pass $upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
