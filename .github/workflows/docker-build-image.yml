name: Build cbioportal image

# Baut das Produktions-Image (Backend + Core-Importer + Frontend-Bundle) via
# tools/build-image.sh. Laeuft bei jedem Push; nur auf dem Release-Branch
# 7.1.1-ukf wird das Image gepusht — als RELEASE_TAG (Repo-Variable
# RELEASE_TAG, Default 7.1.1-ukf) plus -core<sha>-fe<sha>-Kombi-Tag. Auf
# allen anderen Branchen wird nur gebaut (lokal geladen). Der Tag gehoert
# der eigenen 7.1.1-ukf-Linie und ist vom allgemeinen Release-Zyklus
# unabhaengig; "latest" wird nie beruehrt.
#
# Laeuft ohne Repo-Secrets: Die Quellen (PM4Onco/cbioportal-core,
# PM4Onco/cbioportal-frontend) sind oeffentlich und werden ohne Token
# geklont; der Push auf das GHCR-Package pm4onco/cbioportal-image vom
# Release-Branch laeuft ueber das eingebaute GITHUB_TOKEN (permissions: packages: write).

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

concurrency:
  group: cbioportal-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/pm4onco/cbioportal-image
      # Eigenstaendiger Release-Branch; davon wird gepusht. "latest" wird
      # nie genutzt; der Tag laesst sich per Repo-Variable RELEASE_TAG
      # hoehben (Default 7.1.1-ukf).
      RELEASE_BRANCH: 7.1.1-ukf
      RELEASE_TAG: ${{ vars.RELEASE_TAG || '7.1.1-ukf' }}
      # PUSH/PLATFORMS/BRANCH_ENV hängen vom Release-Branch ab, werden aber
      # im Build-Step als Umgebungsvariablen exportiert: env.* ist in
      # job-level env-Ausdrücken nicht referenzierbar.
      # Frontend-Ref: branch-folgend — der gleichnamige Branch im
      # Frontend-Repo muss existieren; Repo-Variable FRONTEND_COMMIT
      # (z. B. SHA) ueberschreibt temporär, z. B. fuer einen Test.
      FRONTEND_COMMIT: ${{ vars.FRONTEND_COMMIT || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      # Version entspricht der packageManager-Pin im Frontend-Repo.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run-install: false

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ env.FRONTEND_COMMIT }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Login to Docker registry
        if: github.ref_name == env.RELEASE_BRANCH
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          # Release-Branch: Multi-Arch-Push mit RELEASE_TAG; alle anderen
          # Branches nur lokal bauen (BRANCH_ENV=rc, single-Arch).
          if [ "$GITHUB_REF_NAME" = "$RELEASE_BRANCH" ]; then
            TAG="$RELEASE_TAG"; PUSH=1; PLATFORMS=linux/amd64,linux/arm64; BRANCH_ENV=master
          else
            TAG="${GITHUB_REF_NAME//\//-}"; PUSH=0; PLATFORMS=linux/amd64; BRANCH_ENV=rc
          fi
          export PUSH PLATFORMS BRANCH_ENV
          chmod +x tools/build-image.sh
          tools/build-image.sh "$TAG"
